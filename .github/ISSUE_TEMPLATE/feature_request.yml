name: Feature request
description: Suggest something Note should do
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Note has a few design commitments that shape what fits — no server, no
        accounts, no telemetry, bring-your-own AI key, and open formats on disk.
        They're spelled out in the
        [README's philosophy section](../blob/main/README.md#philosophy).

        Ideas that need a backend aren't automatically out, but they need to be
        proposed as an opt-in adapter rather than a hard dependency.

  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: Describe the situation you're in, not just the feature you want.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: What should Note do?
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: What have you tried instead?
      description: Existing features, other tools, or manual workarounds.
    validations:
      required: false

  - type: checkboxes
    id: philosophy
    attributes:
      label: Design fit
      options:
        - label: This works without a server, an account, or telemetry
          required: false
        - label: This keeps notes as plain markdown a text editor can read
          required: false
