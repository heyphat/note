version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    groups:
      # One PR for all routine npm updates. Each PR costs a full CI matrix
      # plus a Vercel preview build, and the per-stack grouping this replaced
      # still produced five of them a week.
      #
      # Majors stay out of the group and arrive as their own PRs. Grouping
      # them produced an unmergeable batch: eslint 10 cannot resolve against
      # the eslint-config-next 14 pinned by the Next major ignore below, and
      # tailwindcss 4 and typescript 7 are migrations rather than bumps.
      npm:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    ignore:
      # Next 15 is a deliberate migration, not a dependency bump.
      - dependency-name: "next"
        update-types: ["version-update:semver-major"]
      - dependency-name: "eslint-config-next"
        update-types: ["version-update:semver-major"]
      # React 19 likewise — Milkdown and Excalidraw need checking first.
      - dependency-name: "react"
        update-types: ["version-update:semver-major"]
      - dependency-name: "react-dom"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    groups:
      github-actions:
        patterns: ["*"]
