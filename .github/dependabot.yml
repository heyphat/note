version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
    groups:
      # One PR for every npm update. Each PR costs a full CI matrix plus a
      # Vercel preview build, and the per-stack grouping this replaced still
      # produced five of them a week. Security fixes land together or not at
      # all, so batching them costs nothing in exposure.
      npm:
        patterns: ["*"]
    ignore:
      # Next 15 is a deliberate migration, not a dependency bump.
      - dependency-name: "next"
        update-types: ["version-update:semver-major"]
      - dependency-name: "eslint-config-next"
        update-types: ["version-update:semver-major"]
      # React 19 likewise — Milkdown and Excalidraw need checking first.
      - dependency-name: "react"
        update-types: ["version-update:semver-major"]
      - dependency-name: "react-dom"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    groups:
      github-actions:
        patterns: ["*"]
