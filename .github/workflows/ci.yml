name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Both ends of the supported range in package.json#engines:
        # 22 is the floor (vitest 4 and jsdom 30 require it), 24 is the
        # pinned .nvmrc version.
        node: ['22', '24']
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - run: npm ci

      - run: npm run typecheck
      - run: npm run lint
      - run: npm test

      # `prebuild` regenerates public/docs-bundle from docs/, so this also
      # covers the docs bundler.
      - run: npm run build
